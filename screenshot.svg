<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Header -->
  <text x="400" y="42" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="0.5">
    cron_schedule
  </text>
  <text x="400" y="66" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    Pure Dart Cron Parser · Next-Occurrence Predictor · Human-Readable Translation
  </text>

  <!-- Left: Live Expression & Forecast Card -->
  <g transform="translate(48, 90)">
    <rect width="336" height="275" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />

    <!-- Expression Input Box -->
    <g transform="translate(20, 20)">
      <text x="0" y="14" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">CRON EXPRESSION</text>
      <rect y="22" width="296" height="42" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
      <text x="14" y="49" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="16" font-weight="bold">0 9 * * 1-5</text>
    </g>

    <!-- Translation Banner -->
    <g transform="translate(20, 96)">
      <rect width="296" height="46" rx="10" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.3" />
      <text x="14" y="20" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold">HUMAN TRANSLATION</text>
      <text x="14" y="36" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold">At 09:00, Monday through Friday</text>
    </g>

    <!-- Next Occurrences Forecast -->
    <g transform="translate(20, 154)">
      <text x="0" y="14" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">UPCOMING TIMESTAMPS</text>
      
      <rect y="22" width="296" height="26" rx="6" fill="#0F172A" />
      <text x="12" y="39" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Mon, 05 Oct 2026</text>
      <text x="235" y="39" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" font-weight="bold">09:00:00</text>

      <rect y="54" width="296" height="26" rx="6" fill="#0F172A" />
      <text x="12" y="71" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Tue, 06 Oct 2026</text>
      <text x="235" y="71" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" font-weight="bold">09:00:00</text>
    </g>
  </g>

  <!-- Right: Technical Capabilities Card -->
  <g transform="translate(416, 90)">
    <rect width="336" height="275" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />

    <text x="24" y="32" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">
      Key Technical Features
    </text>

    <!-- Point 1 -->
    <g transform="translate(24, 52)">
      <circle cx="12" cy="16" r="10" fill="#38BDF8" fill-opacity="0.2" />
      <text x="12" y="20" text-anchor="middle" fill="#38BDF8" font-size="11" font-weight="bold">🔮</text>
      <text x="32" y="14" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">
        Next-N Occurrence Forecast
      </text>
      <text x="32" y="28" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">
        Calculates upcoming timestamps for local notifications
      </text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(24, 102)">
      <circle cx="12" cy="16" r="10" fill="#10B981" fill-opacity="0.2" />
      <text x="12" y="20" text-anchor="middle" fill="#10B981" font-size="11" font-weight="bold">🗣️</text>
      <text x="32" y="14" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">
        Human-Readable Translation
      </text>
      <text x="32" y="28" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">
        Renders clean UI explanations without extra packages
      </text>
    </g>

    <!-- Point 3 -->
    <g transform="translate(24, 152)">
      <circle cx="12" cy="16" r="10" fill="#FBBF24" fill-opacity="0.2" />
      <text x="12" y="20" text-anchor="middle" fill="#FBBF24" font-size="11" font-weight="bold">🛠️</text>
      <text x="32" y="14" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">
        Type-Safe Fluent Builder
      </text>
      <text x="32" y="28" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">
        Constructs schedules via CronSchedule.builder().daily()
      </text>
    </g>

    <!-- Point 4 -->
    <g transform="translate(24, 202)">
      <circle cx="12" cy="16" r="10" fill="#A855F7" fill-opacity="0.2" />
      <text x="12" y="20" text-anchor="middle" fill="#C084FC" font-size="11" font-weight="bold">⚡</text>
      <text x="32" y="14" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">
        Ultra-Fast &amp; Pure Dart
      </text>
      <text x="32" y="28" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">
        Sub-10 microsecond evaluation across all 6 platforms
      </text>
    </g>
  </g>
</svg>
